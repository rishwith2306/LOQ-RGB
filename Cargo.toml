[package]
name = "lenovo-rgb"
version = "0.1.0"
edition = "2021"
authors = ["Ceaser"]
description = "Control Lenovo Legion / LOQ 4-zone RGB keyboards on Linux"
license = "MIT"

[dependencies]
clap = { version = "4.5", features = ["derive", "cargo"] }
clap_complete = "4.5"
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
crossterm = { version = "0.28", features = ["event-stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = "0.33"
libc = "0.2"
anyhow = "1.0"
thiserror = "2.0"
directories = "5.0"
ctrlc = "3.4"
colored = "2.2"
